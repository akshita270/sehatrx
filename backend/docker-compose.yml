services:
  postgres:
    image: postgres:16-alpine
    container_name: sehatrx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sehatrx
      POSTGRES_PASSWORD: sehatrx
      POSTGRES_DB: sehatrx
    ports:
      - "5432:5432"
    volumes:
      - sehatrx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sehatrx"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sehatrx_pgdata:
